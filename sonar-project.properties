# Análisis estático con SonarCloud (criterio G3 y Quality Gate del eje B).
# Lo corre el job "Análisis estático (SonarCloud)" de .github/workflows/ci.yml.
#
# Una sola vez, alguien del grupo con permisos en el repo:
#   1. Entra a https://sonarcloud.io con GitHub e importa JuanmaGrispo/admin-consorcios.
#   2. Si la organización o la clave del proyecto quedan distintas, las corrige acá.
#   3. En Administration → Analysis Method apaga "Automatic Analysis" (choca con el CI).
#   4. Genera un token (My Account → Security) y lo carga en GitHub como secret
#      SONAR_TOKEN (Settings → Secrets and variables → Actions).
sonar.organization=juanmagrispo
sonar.projectKey=JuanmaGrispo_admin-consorcios
sonar.projectName=Domus - admin-consorcios

sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/src,apps/frontend/acceptance,apps/backend/acceptance
sonar.test.inclusions=**/*.spec.ts,**/*.e2e.ts,**/*.test.cjs
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/.next/**

# Generado desde la base (no se edita a mano) y migraciones: fuera de duplicación y cobertura.
sonar.cpd.exclusions=apps/backend/src/database/entities/**,apps/backend/src/database/migrations/**
# La cobertura que exige la cátedra es de la capa de negocio; el front se prueba con Playwright.
sonar.coverage.exclusions=apps/frontend/**,apps/backend/src/database/**,apps/backend/src/scripts/**,apps/backend/src/main.ts,**/*.module.ts,**/*.dto.ts,**/dto/**

sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
