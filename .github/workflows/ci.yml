name: CI de versión
run-name: CI de ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Análisis de tipos (backend y frontend)
            id: tipos
            comando: pnpm typecheck
          - nombre: ESLint (frontend)
            id: lint
            comando: pnpm front lint
          - nombre: Pruebas automatizadas con cobertura
            id: pruebas
            comando: pnpm back test:cobertura
          - nombre: Compilación (backend y frontend)
            id: build
            comando: pnpm build
          - nombre: Aceptación — timeouts de proveedores
            id: proveedores
            comando: pnpm back test:aceptacion:proveedores
          - nombre: Aceptación — Problem Details
            id: errores
            comando: pnpm back test:aceptacion:errores
          - nombre: Aceptación — email
            id: email
            comando: pnpm back test:aceptacion:email
          - nombre: Integración — PostgreSQL y RabbitMQ
            id: infraestructura
            comando: pnpm back test:aceptacion:docker
          - nombre: Aceptación — API, web, carga, colección Postman y contrato
            id: integral
            comando: pnpm back test:aceptacion:integral --web --carga --newman --contrato
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependencias del lockfile
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium de aceptación
        if: matrix.id == 'integral'
        run: pnpm front exec playwright install --with-deps chromium

      - name: Ejecutar verificación
        shell: bash
        run: |
          mkdir -p resultados
          ${{ matrix.comando }} 2>&1 | tee resultados/verificacion.log

      - name: Conservar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.id }}
          path: |
            resultados/verificacion.log
            apps/backend/coverage/**
            apps/backend/acceptance/resultados/integral.json
            apps/backend/acceptance/resultados/carga-resumen.json
            apps/backend/acceptance/resultados/newman.xml
            apps/backend/acceptance/resultados/schemathesis.xml
            apps/backend/acceptance/resultados/web/reporte.json
            apps/backend/acceptance/resultados/web/**/*.png
          if-no-files-found: ignore
          retention-days: 30

  # Corre solo si el repo tiene el secret SONAR_TOKEN (pasos en
  # sonar-project.properties). Sin el secret, los pasos se saltean y el job
  # queda en verde con un aviso, para no romper el CI mientras no esté cargado.
  analisis:
    name: Análisis estático (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Solo indica si el secret existe; el token en sí va únicamente al paso de Sonar.
      HAY_TOKEN_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Avisar si falta el token de SonarCloud
        if: env.HAY_TOKEN_SONAR != 'true'
        run: echo "::warning title=SonarCloud::Falta el secret SONAR_TOKEN; se saltea el análisis."

      - name: Descargar el código con historial (blame y código nuevo)
        if: env.HAY_TOKEN_SONAR == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar pnpm
        if: env.HAY_TOKEN_SONAR == 'true'
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        if: env.HAY_TOKEN_SONAR == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependencias del lockfile
        if: env.HAY_TOKEN_SONAR == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pruebas unitarias con cobertura (lcov)
        if: env.HAY_TOKEN_SONAR == 'true'
        shell: bash
        run: |
          pnpm back test:cobertura
          # node:test escribe rutas relativas a apps/backend; Sonar las resuelve desde la raíz.
          sed -i 's#^SF:src/#SF:apps/backend/src/#' apps/backend/coverage/lcov.info

      - name: Análisis de SonarCloud y espera del Quality Gate
        if: env.HAY_TOKEN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # El tag sale de main: se analiza como main. qualitygate.wait deja el job
          # en rojo si el Quality Gate no aprueba.
          args: >
            -Dsonar.branch.name=main
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Escanear todos los commits de todas las ramas
        run: ./gitleaks git . --log-opts="--all" --redact --no-banner --verbose