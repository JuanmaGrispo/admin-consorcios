name: CI de versión
run-name: CI de ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verificar:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Análisis de tipos (backend y frontend)
            comando: pnpm typecheck
          - nombre: ESLint (frontend)
            comando: pnpm front lint
          - nombre: Pruebas automatizadas
            comando: pnpm test
          - nombre: Compilación (backend y frontend)
            comando: pnpm build
    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependencias del lockfile
        run: pnpm install --frozen-lockfile

      - name: Ejecutar verificación
        run: ${{ matrix.comando }}

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Escanear todos los commits de todas las ramas
        run: ./gitleaks git . --log-opts="--all" --redact --no-banner --verbose
